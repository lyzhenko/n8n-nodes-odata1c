name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # n8n 2.x requires Node.js >= 24, and so does the n8n-workflow devDependency
        # (n8n-workflow → @n8n/expression-runtime → isolated-vm, which refuses older
        # runtimes and builds from source), so older versions cannot even run npm ci.
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and end-to-end tests (bundled 1C OData mock)
        run: npm test

      - name: Package contents
        run: npm pack --dry-run
